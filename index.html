<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SPROUT — Grocery Budget</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f7f3e7;--surface:#ffffff;--surface2:#efe9d8;--surface3:#e4dcc4;
  --border:#ddd3b8;--border2:#c9bd9c;--text:#33363b;--text2:#71747a;--text3:#9a9c9a;
  --accent:#4f9d78;--accent2:#397856;--accent-dim:#e2f2e8;
  --chip:#3a3d38;--danger:#c0504a;--radius:12px;--radius-sm:8px;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;-webkit-text-size-adjust:100%;overflow-x:hidden}
button{font-family:'DM Sans',sans-serif;cursor:pointer;border:none;background:none}
input,textarea,select{font-family:'DM Sans',sans-serif}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{0%,100%{transform:translateY(0);opacity:.4}50%{transform:translateY(-4px);opacity:1}}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

/* Auth */
.auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at 50% 0%,rgba(79,157,120,.10),transparent 60%)}
.auth-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:32px;width:100%;max-width:380px;box-shadow:0 2px 24px rgba(0,0,0,.04)}
.auth-logo{font-family:'DM Serif Display',serif;font-size:32px;color:var(--accent2);text-align:center;margin-bottom:4px;letter-spacing:-1px}
.auth-sub{text-align:center;font-size:13px;color:var(--text3);margin-bottom:24px}
.auth-tabs{display:flex;gap:2px;background:var(--surface2);padding:3px;border-radius:var(--radius-sm);margin-bottom:18px;border:1px solid var(--border)}
.auth-tab{flex:1;padding:8px;border-radius:6px;font-size:13px;font-weight:500;color:var(--text2);text-align:center;cursor:pointer;transition:all .15s}
.auth-tab.on{background:var(--surface);color:var(--text)}
.af{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.af label{font-size:12px;color:var(--text3)}
.af input{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;color:var(--text);font-size:14px;outline:none;transition:border-color .15s;-webkit-appearance:none;width:100%}
.af input:focus{border-color:var(--accent)}
.auth-btn{width:100%;padding:12px;border-radius:var(--radius-sm);background:var(--accent);color:#fff;font-size:14px;font-weight:700;margin-top:6px;border:none;cursor:pointer}
.auth-btn:hover{background:var(--accent2)}
.auth-btn:disabled{opacity:.4}
.auth-msg{font-size:12px;text-align:center;margin-top:10px}

/* Shell */
.app{min-height:100vh;display:flex;flex-direction:column}
.header{border-bottom:1px solid var(--border);padding:0 18px;height:50px;display:flex;align-items:center;justify-content:space-between;background:var(--surface);position:sticky;top:0;z-index:60;flex-shrink:0}
.logo{font-family:'DM Serif Display',serif;font-size:19px;color:var(--accent2)}
.desk-nav{display:flex;gap:2px}
.nb{padding:5px 11px;border-radius:var(--radius-sm);font-size:12px;font-weight:500;color:var(--text2);transition:all .15s;border:none;background:none;cursor:pointer}
.nb:hover{color:var(--text);background:var(--surface2)}
.nb.on{color:var(--accent2);background:var(--accent-dim)}
.hbtn{padding:4px 9px;border-radius:var(--radius-sm);font-size:11px;color:var(--text3);border:1px solid var(--border);background:none;cursor:pointer;transition:all .15s}
.hbtn:hover{color:var(--text)}
.syncing{font-size:11px;color:var(--text3);display:flex;align-items:center;gap:4px}
.spin-sm{width:9px;height:9px;border:1.5px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}

/* Layout */
.main{flex:1;display:flex;height:calc(100vh - 50px);overflow:hidden}
.sidebar{width:300px;flex-shrink:0;border-right:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;overflow:hidden}
.content{flex:1;overflow-y:auto;padding:18px;padding-bottom:24px}

/* Sidebar input */
.stop{padding:11px;border-bottom:1px solid var(--border);flex-shrink:0}
.mode-tabs{display:flex;gap:2px;background:var(--surface2);padding:3px;border-radius:var(--radius-sm);border:1px solid var(--border);margin-bottom:9px}
.mtab{flex:1;padding:5px 3px;border-radius:5px;font-size:11px;font-weight:500;color:var(--text3);text-align:center;cursor:pointer;transition:all .15s;white-space:nowrap}
.mtab.on{background:var(--surface);color:var(--accent2)}
.sinput{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:7px 10px;color:var(--text);font-size:12px;outline:none;transition:border-color .15s;-webkit-appearance:none;display:block}
.sinput:focus{border-color:var(--accent)}
.sinput.mb{margin-bottom:7px}
.cta{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;color:var(--text);font-size:13px;resize:none;min-height:52px;max-height:100px;outline:none;line-height:1.5;-webkit-appearance:none}
.cta:focus{border-color:var(--border2)}
.crow{display:flex;gap:5px;align-items:flex-end;margin-top:7px}
.sbtn{width:34px;height:34px;border-radius:var(--radius-sm);background:var(--accent);color:#fff;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:none;cursor:pointer;transition:all .15s}
.sbtn:hover{background:var(--accent2)}
.sbtn:disabled{opacity:.4;cursor:default}
.camrow{display:flex;gap:5px;margin-top:7px}
.cambtn{flex:1;padding:8px;border-radius:var(--radius-sm);background:var(--surface2);border:1px solid var(--border);color:var(--text2);font-size:12px;font-weight:500;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:5px}
.cambtn:hover{color:var(--text);border-color:var(--border2)}
.hint{font-size:10px;color:var(--text3);margin-top:5px;line-height:1.4}
.man-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:7px}
.add-btn{width:100%;padding:8px;border-radius:var(--radius-sm);background:var(--accent);color:#fff;font-size:13px;font-weight:700;border:none;cursor:pointer;margin-top:2px}
.add-btn:hover{background:var(--accent2)}
.photo-prev{position:relative;margin-top:7px;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border)}
.photo-prev img{width:100%;display:block;max-height:120px;object-fit:cover}
.photo-x{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;cursor:pointer}

/* Log */
.log{flex:1;overflow-y:auto;padding:9px 10px;display:flex;flex-direction:column;gap:5px}
.li{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;animation:fadeIn .2s ease}
.lh{display:flex;justify-content:space-between;align-items:flex-start;gap:5px}
.ln{font-size:13px;font-weight:500;color:var(--text);line-height:1.3}
.ldesc{font-size:10px;color:var(--text3);margin-top:2px;font-style:italic}
.lamt{font-size:13px;font-weight:600;color:var(--accent2);flex-shrink:0}
.ldel{opacity:0;font-size:10px;color:var(--text3);cursor:pointer;padding:1px 3px;transition:opacity .15s;border:none;background:none}
.li:hover .ldel{opacity:1}
.ldel:hover{color:var(--danger)}
.catpill{font-size:10px;font-weight:500;padding:2px 6px;border-radius:3px;display:inline-block;margin-top:5px}

/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.ctitle{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);margin-bottom:12px;font-weight:500}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.snum{font-family:'DM Serif Display',serif;font-size:30px;line-height:1}
.sunit{font-size:12px;color:var(--text2);margin-left:3px}
.pbar{height:6px;background:var(--surface3);border-radius:3px;overflow:hidden;margin-top:8px}
.pfill{height:100%;border-radius:3px;transition:width .5s}
.stitle{font-family:'DM Serif Display',serif;font-size:21px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.savebtn{padding:8px 16px;border-radius:var(--radius-sm);background:var(--accent);color:#fff;font-size:13px;font-weight:700;border:none;cursor:pointer;transition:all .15s}
.savebtn:hover{background:var(--accent2)}
.range-tabs{display:flex;gap:2px;background:var(--surface2);padding:3px;border-radius:var(--radius-sm);border:1px solid var(--border)}
.rtab{flex:1;padding:5px 10px;border-radius:5px;font-size:11px;font-weight:600;color:var(--text3);text-align:center;cursor:pointer;transition:all .15s;white-space:nowrap;border:none;background:none}
.rtab.on{background:var(--accent);color:#fff}
.chart-scroll{overflow-x:auto;padding-bottom:4px}
.bar-chart{display:flex;gap:3px;align-items:flex-end;min-width:100%;height:90px}
.bc{display:flex;flex-direction:column;align-items:center;gap:2px;flex-shrink:0;justify-content:flex-end;height:100%}
.bcbar{border-radius:3px 3px 0 0;min-height:3px;transition:height .3s;width:20px}
.bclbl{font-size:9px;color:var(--text3);text-align:center;line-height:1.2}
.grow{display:flex;flex-direction:column;gap:4px;margin-bottom:9px}
.grow label{font-size:12px;color:var(--text3)}
.grow input,.grow select,.grow textarea{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:7px 10px;color:var(--text);font-size:13px;outline:none;width:100%;-webkit-appearance:none;font-family:'DM Sans',sans-serif}
.grow input:focus,.grow textarea:focus{border-color:var(--accent)}
.empty{text-align:center;padding:28px 14px;color:var(--text3);font-size:13px}
.eico{font-size:26px;margin-bottom:7px;opacity:.5}
.catrow{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--border);cursor:pointer;transition:opacity .15s}
.catrow:hover{opacity:.7}
.catrow:last-child{border-bottom:none}
.catdot{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.catname{font-size:13px;flex:1}
.catamt{font-size:13px;font-weight:600}
.catpct{font-size:10px;color:var(--text3);min-width:32px;text-align:right}
.surplus-pos{color:var(--accent2)}
.surplus-neg{color:var(--danger)}
.backlink{font-size:12px;color:var(--text2);cursor:pointer;margin-bottom:10px;display:inline-flex;align-items:center;gap:4px}
.backlink:hover{color:var(--accent2)}

/* Overlay */
.ov{position:fixed;inset:0;background:rgba(30,28,20,.5);z-index:200;display:flex;align-items:flex-end;justify-content:center;padding:0}
.ovbox{background:var(--surface);border:1px solid var(--border);border-top-left-radius:var(--radius);border-top-right-radius:var(--radius);width:100%;max-width:540px;max-height:90vh;display:flex;flex-direction:column;padding:18px;animation:slideUp .22s ease;overflow-y:auto}
.ovtitle{font-family:'DM Serif Display',serif;font-size:18px}
.ovcl{font-size:16px;color:var(--text3);cursor:pointer;padding:2px 6px;border:none;background:none}
.cbtn-yes{padding:8px 18px;border-radius:var(--radius-sm);background:var(--danger);color:white;font-size:13px;font-weight:500;border:none;cursor:pointer}
.cbtn-no{padding:8px 18px;border-radius:var(--radius-sm);background:var(--surface2);color:var(--text);font-size:13px;border:1px solid var(--border);cursor:pointer}
.itemrow{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 11px;margin-bottom:6px}
.itemname{font-size:13px;font-weight:500}
.itemcat{font-size:10px;color:var(--text3);margin-top:2px}
.itemamt{font-size:13px;font-weight:600;color:var(--accent2);flex-shrink:0}

/* Settings */
.tog-row{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:5px}
.toglbl{font-size:13px}
.togdesc{font-size:11px;color:var(--text3);margin-top:2px}

/* History */
.hentry{padding:8px 0;border-top:1px solid var(--border)}
.hentry:first-child{border-top:none}
.hrow{display:flex;justify-content:space-between;align-items:flex-start;gap:7px}
.hname{font-size:13px;color:var(--text);font-weight:500}
.hdesc{font-size:10px;color:var(--text3);font-style:italic;margin-top:1px}
.hamt{font-size:13px;font-weight:600;color:var(--accent2)}
.month-hdr{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;margin-top:16px}
.month-hdr:first-child{margin-top:0}
.month-title{font-family:'DM Serif Display',serif;font-size:16px}
.month-sub{font-size:11px;color:var(--text3)}
.month-label-tag{font-size:11px;color:var(--accent2);font-style:italic;margin-top:2px}

/* Mobile bottom nav */
.mob-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);z-index:60;padding-bottom:env(safe-area-inset-bottom,0px);padding-top:2px}
.mnbtn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 2px 4px;font-size:9px;font-weight:500;color:var(--text3);gap:2px;cursor:pointer;border:none;background:none;font-family:'DM Sans',sans-serif;transition:color .15s}
.mnbtn.on{color:var(--accent2)}
.mnico{font-size:17px;line-height:1}

@media(max-width:700px){
  .header{height:46px;padding:0 12px}
  .desk-nav{display:none}
  .main{flex-direction:column;height:auto;overflow:visible}
  .sidebar{width:100%;border-right:none;border-bottom:1px solid var(--border);max-height:52vh;min-height:0}
  .content{padding:12px;padding-bottom:72px}
  .mob-nav{display:flex}
  .g2,.g3{grid-template-columns:1fr}
  .ovbox{border-radius:var(--radius) var(--radius) 0 0;max-height:92vh}
  .stitle{font-size:18px;margin-bottom:12px}
}
@media(min-width:701px){
  .mob-nav{display:none!important}
}
</style>
</head>
<body>
<div id="root"></div>
<script>
// ══════════════════════════════════════════════════════════════
// TODO: replace with your own Supabase project credentials
// (create a NEW project separate from your macro tracker, then
//  run the SQL in grocery_schema.sql inside the SQL editor)
// ══════════════════════════════════════════════════════════════
const SUPABASE_URL  = 'https://ijmdtdlfoffronobqxxi.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlqbWR0ZGxmb2Zmcm9ub2JxeHhpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMwMjQxMTksImV4cCI6MjA5ODYwMDExOX0.b6xYCZhF6hWZQCp5aBzYcMCPhnvWmxI_tUXg6p3tHoo';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
const {useState,useEffect,useRef,useMemo} = React;
const h = React.createElement;

// ── Date helpers, always LOCAL timezone ─────────────────────────
function localDate(d){ d=d||new Date(); const yr=d.getFullYear(),mo=String(d.getMonth()+1).padStart(2,'0'),dy=String(d.getDate()).padStart(2,'0'); return `${yr}-${mo}-${dy}`; }
function todayStr(){ return localDate(new Date()); }
function monthKey(dateStr){ return dateStr.slice(0,7); } // 'YYYY-MM'
function todayMonthKey(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }
function monthLabel(mk){ const [y,m]=mk.split('-').map(Number); return new Date(y,m-1,1).toLocaleDateString('en-US',{month:'long',year:'numeric'}); }
function monthShort(mk){ const [y,m]=mk.split('-').map(Number); return new Date(y,m-1,1).toLocaleDateString('en-US',{month:'short'}); }
function addMonths(mk,n){ const [y,m]=mk.split('-').map(Number); const d=new Date(y,m-1+n,1); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }
function lastNMonthKeys(n){ const cur=todayMonthKey(); return Array.from({length:n},(_,i)=>addMonths(cur,-(n-1-i))); }
function localTime(isoStr){ return new Date(isoStr).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); }
function fmtMoney(n){ const v=Math.round((n||0)*100)/100; return '$'+v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }

// ── Categories ────────────────────────────────────────────────
const CATEGORIES=[
  {id:'groceries',label:'Groceries',color:'#4f9d78'},
  {id:'dining',label:'Dining Out',color:'#7ab894'},
  {id:'gas_transport',label:'Gas & Transport',color:'#3f8f6f'},
  {id:'household',label:'Household',color:'#5aa88a'},
  {id:'personal_care',label:'Personal Care',color:'#8fc7a8'},
  {id:'clothing',label:'Clothing',color:'#6bb090'},
  {id:'entertainment',label:'Entertainment',color:'#397856'},
  {id:'health',label:'Health & Pharmacy',color:'#a3d4b8'},
  {id:'pets',label:'Pets',color:'#579b7d'},
  {id:'alcohol_bars',label:'Alcohol & Bars',color:'#729b7f'},
  {id:'kids_baby',label:'Kids & Baby',color:'#8ab89c'},
  {id:'subscriptions',label:'Subscriptions',color:'#4c8f6e'},
  {id:'other',label:'Other / Misc',color:'#9a9c9a'}
];
const CAT_MAP=Object.fromEntries(CATEGORIES.map(c=>[c.id,c]));
function catInfo(id){ return CAT_MAP[id]||CAT_MAP.other; }

// ── Auth ──────────────────────────────────────────────────────
function AuthScreen({onAuth}){
  const [tab,setTab]=useState('login');
  const [email,setEmail]=useState(''); const [pass,setPass]=useState(''); const [name,setName]=useState('');
  const [busy,setBusy]=useState(false); const [err,setErr]=useState(''); const [msg,setMsg]=useState('');
  async function submit(){
    setErr('');setMsg('');setBusy(true);
    if(tab==='login'){
      const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
      if(error)setErr(error.message); else onAuth(data.user);
    } else {
      const {data,error}=await sb.auth.signUp({email,password:pass,options:{data:{display_name:name}}});
      if(error)setErr(error.message);
      else if(data.user&&!data.session)setMsg('Check your email to confirm.');
      else if(data.user)onAuth(data.user);
    }
    setBusy(false);
  }
  const onK=e=>{if(e.key==='Enter')submit();};
  return h('div',{className:'auth-screen'},
    h('div',{className:'auth-card'},
      h('div',{className:'auth-logo'},'SPROUT'),
      h('div',{className:'auth-sub'},'AI-powered grocery & budget tracking'),
      h('div',{className:'auth-tabs'},['login','signup'].map(t=>h('div',{key:t,className:'auth-tab'+(tab===t?' on':''),onClick:()=>{setTab(t);setErr('');setMsg('')}},t==='login'?'Sign in':'Create account'))),
      tab==='signup'&&h('div',{className:'af'},h('label',null,'Name'),h('input',{type:'text',placeholder:'Your name',value:name,onChange:e=>setName(e.target.value),onKeyDown:onK})),
      h('div',{className:'af'},h('label',null,'Email'),h('input',{type:'email',placeholder:'you@example.com',value:email,onChange:e=>setEmail(e.target.value),onKeyDown:onK})),
      h('div',{className:'af'},h('label',null,'Password'),h('input',{type:'password',placeholder:'••••••••',value:pass,onChange:e=>setPass(e.target.value),onKeyDown:onK})),
      h('button',{className:'auth-btn',onClick:submit,disabled:busy},busy?'Please wait…':tab==='login'?'Sign in':'Create account'),
      msg&&h('div',{className:'auth-msg',style:{color:'var(--accent2)'}},msg),
      err&&h('div',{className:'auth-msg',style:{color:'var(--danger)'}},err)
    )
  );
}

// ── Small pieces ──────────────────────────────────────────────
function Bubble(){ return h('div',{style:{display:'flex',gap:4,alignItems:'center',padding:'3px 0'}},[0,1,2].map(i=>h('span',{key:i,style:{width:4,height:4,borderRadius:'50%',background:'var(--accent)',animation:`bob 1s ease-in-out infinite`,animationDelay:(i*.2)+'s'}}))); }

function BudgetBar({spent,budget}){
  const pct=budget>0?Math.min(100,(spent/budget)*100):0;
  const over=spent>budget&&budget>0;
  return h('div',{className:'pbar'},h('div',{className:'pfill',style:{width:pct+'%',background:over?'var(--danger)':'var(--accent)'}}));
}

function CategoryPie({totals}){
  const ref=useRef(null),chart=useRef(null);
  const entries=Object.entries(totals).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  const total=entries.reduce((s,[,v])=>s+v,0);
  useEffect(()=>{
    if(!ref.current)return;
    if(chart.current)chart.current.destroy();
    if(!total){return;}
    chart.current=new Chart(ref.current,{type:'doughnut',data:{labels:entries.map(([k])=>catInfo(k).label),datasets:[{data:entries.map(([,v])=>v),backgroundColor:entries.map(([k])=>catInfo(k).color),borderWidth:0,hoverOffset:4}]},options:{responsive:true,maintainAspectRatio:false,cutout:'68%',plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>` ${fmtMoney(ctx.raw)} (${Math.round((ctx.raw/total)*100)}%)`}}}}});
    return()=>{if(chart.current)chart.current.destroy();};
  },[JSON.stringify(totals)]);
  if(!total) return h('div',{className:'empty'},h('div',{className:'eico'},'🥕'),'No purchases logged yet for this period');
  return h('div',{style:{display:'flex',alignItems:'center',gap:'16px',flexWrap:'wrap'}},
    h('div',{style:{width:'128px',height:'128px',flexShrink:0}},h('canvas',{ref})),
    h('div',{style:{display:'flex',flexDirection:'column',gap:'6px',flex:1,minWidth:'160px'}},
      entries.map(([k,v])=>h('div',{key:k,style:{display:'flex',alignItems:'center',gap:'7px'}},
        h('div',{style:{width:'8px',height:'8px',borderRadius:'2px',background:catInfo(k).color,flexShrink:0}}),
        h('span',{style:{fontSize:'12px',color:'var(--text2)',flex:1}},catInfo(k).label),
        h('span',{style:{fontSize:'13px',fontWeight:600,color:catInfo(k).color}},fmtMoney(v))
      ))
    )
  );
}

function BarTrend({buckets,onClick}){
  const max=Math.max(...buckets.map(b=>b.spent),1);
  return h('div',{className:'chart-scroll'},h('div',{className:'bar-chart'},
    buckets.map((b,i)=>{
      const ht=Math.round((b.spent/max)*74);
      const over=b.budget>0&&b.spent>b.budget;
      return h('div',{key:i,className:'bc',onClick:()=>onClick&&onClick(b),style:{cursor:onClick?'pointer':'default'}},
        h('div',{style:{fontSize:'9px',color:'var(--text3)'}},b.spent>0?fmtMoney(b.spent).replace('.00',''):''),
        h('div',{className:'bcbar',style:{height:ht+'px',background:over?'var(--danger)':'var(--accent)'}}),
        h('span',{className:'bclbl'},b.label)
      );
    })
  ));
}

// ── AI review overlay (for parsed AI / receipt items) ──────────
function ReviewOverlay({items,onConfirm,onClose,title}){
  const [rows,setRows]=useState(items.map(it=>({...it})));
  function upd(i,k,v){ setRows(p=>p.map((r,idx)=>idx===i?{...r,[k]:v}:r)); }
  function removeRow(i){ setRows(p=>p.filter((_,idx)=>idx!==i)); }
  const total=rows.reduce((s,r)=>s+(parseFloat(r.amount)||0),0);
  return h('div',{className:'ov',onClick:onClose},
    h('div',{className:'ovbox',onClick:e=>e.stopPropagation()},
      h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'10px'}},h('div',{className:'ovtitle'},title||'Review purchases'),h('button',{className:'ovcl',onClick:onClose},'✕')),
      rows.length===0&&h('div',{className:'empty'},'No items parsed.'),
      rows.map((r,i)=>h('div',{key:i,className:'itemrow'},
        h('div',{style:{flex:1}},
          h('input',{value:r.name,onChange:e=>upd(i,'name',e.target.value),style:{background:'transparent',border:'none',fontSize:'13px',fontWeight:500,color:'var(--text)',outline:'none',width:'100%',padding:0,marginBottom:'3px'}}),
          h('select',{value:r.category,onChange:e=>upd(i,'category',e.target.value),style:{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'5px',fontSize:'10px',color:'var(--text2)',padding:'2px 4px'}},
            CATEGORIES.map(c=>h('option',{key:c.id,value:c.id},c.label))
          )
        ),
        h('input',{type:'number',value:r.amount,onChange:e=>upd(i,'amount',e.target.value),style:{width:'70px',textAlign:'right',background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'5px',fontSize:'13px',fontWeight:600,color:'var(--accent2)',padding:'5px 6px'}}),
        h('button',{className:'ldel',style:{opacity:1},onClick:()=>removeRow(i)},'✕')
      )),
      rows.length>0&&h('div',{style:{display:'flex',justifyContent:'space-between',padding:'8px 2px',fontSize:'13px',fontWeight:600,borderTop:'1px solid var(--border)',marginTop:'4px'}},h('span',null,'Total'),h('span',{style:{color:'var(--accent2)'}},fmtMoney(total))),
      h('button',{className:'add-btn',style:{marginTop:'12px'},disabled:rows.length===0,onClick:()=>onConfirm(rows)},'Log '+rows.length+' purchase'+(rows.length===1?'':'s'))
    )
  );
}

// ── Main App ──────────────────────────────────────────────────
function App({user,onLogout}){
  const [view,setView]=useState('month');
  const [purchases,setPurchases]=useState([]); // flat array, newest last
  const [budgets,setBudgets]=useState({}); // {mk: {amount,label,id}}
  const [selectedMonth,setSelectedMonth]=useState(todayMonthKey());
  const [trendRange,setTrendRange]=useState('3m'); // 3m,6m,1y
  const [drill,setDrill]=useState(null); // {category, range:{type:'month'|'trend',mk or months}}
  const [inputMode,setInputMode]=useState('ai');
  const [aiText,setAiText]=useState('');
  const [manual,setManual]=useState({name:'',amount:'',category:'groceries',description:''});
  const [photoPreview,setPhotoPreview]=useState(null);
  const [reviewItems,setReviewItems]=useState(null);
  const [reviewTitle,setReviewTitle]=useState('');
  const [loading,setLoading]=useState(false);
  const [syncing,setSyncing]=useState(false);
  const [showConfirm,setShowConfirm]=useState(false);
  const [budgetInput,setBudgetInput]=useState('');
  const [labelInput,setLabelInput]=useState('');
  const fileInputRef=useRef(null);
  const logRef=useRef(null);

  useEffect(()=>{
    async function init(){
      setSyncing(true);
      const since=new Date(); since.setFullYear(since.getFullYear()-3);
      const {data:pu}=await sb.from('purchases').select('*').eq('user_id',user.id).gte('purchase_date',localDate(since)).order('purchase_at',{ascending:true});
      if(pu)setPurchases(pu.map(r=>({id:r.id,name:r.name,description:r.description||'',amount:Number(r.amount),category:r.category,date:r.purchase_date,at:r.purchase_at})));
      const {data:bg}=await sb.from('budgets').select('*').eq('user_id',user.id);
      if(bg){ const map={}; bg.forEach(r=>{map[r.month]={id:r.id,amount:Number(r.amount),label:r.label||''};}); setBudgets(map); }
      setSyncing(false);
    }
    init();
  },[user.id]);

  useEffect(()=>{logRef.current?.scrollIntoView({behavior:'smooth'});},[purchases,loading]);
  useEffect(()=>{ setBudgetInput(budgets[selectedMonth]?.amount!=null?String(budgets[selectedMonth].amount):''); setLabelInput(budgets[selectedMonth]?.label||''); },[selectedMonth,budgets]);

  async function callClaude(messages,system){
    const res=await fetch('/api/claude',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-5-20250929',max_tokens:1200,system,messages})});
    if(!res.ok){const t=await res.text();throw new Error('API '+res.status+': '+t.slice(0,100));}
    const data=await res.json();
    if(data.error)throw new Error(data.error.message||JSON.stringify(data.error));
    return data.content.map(b=>b.type==='text'?b.text:'').filter(Boolean).join('\n').trim();
  }

  const catListStr=CATEGORIES.map(c=>c.id).join(', ');

  async function saveRows(rows){
    const nowIso=new Date().toISOString();
    const tod=todayStr();
    const inserts=rows.map(r=>({user_id:user.id,name:r.name||'Purchase',description:r.description||'',amount:parseFloat(r.amount)||0,category:CAT_MAP[r.category]?r.category:'other',purchase_date:tod,purchase_at:nowIso}));
    const {data,error}=await sb.from('purchases').insert(inserts).select();
    if(error){ alert('DB error: '+error.message); return; }
    if(data)setPurchases(p=>[...p,...data.map(r=>({id:r.id,name:r.name,description:r.description||'',amount:Number(r.amount),category:r.category,date:r.purchase_date,at:r.purchase_at}))]);
    // ensure a budget row exists for this month so it shows up in history even with $0 budget
    ensureMonthRow(monthKey(tod));
  }

  async function ensureMonthRow(mk){
    if(budgets[mk]!==undefined)return;
    setBudgets(p=>({...p,[mk]:{id:null,amount:0,label:''}}));
  }

  async function handleAiSend(){
    const msg=aiText.trim();
    if(!msg&&!photoPreview)return;
    if(loading)return;
    setLoading(true);
    const sys=`You are a precise grocery/budget-bill parsing AI. The user will describe one or more purchases they made (could be a single item, a multi-item shopping trip, or several unrelated purchases in one message). Break it into individual line items where sensible, but combine an entire grocery-store trip into ONE item named after the store if the user just gives a single total for it (e.g. "HEB $85" -> one item, not fabricated line items).
For EACH item, assign the best-fit category id from this exact list: ${catListStr}. Use "other" only if nothing else fits.
Return ONLY valid JSON, no markdown, no text outside the JSON:
{"items":[{"name":"short item or store name","description":"optional extra context or empty string","amount":number,"category":"category_id"}]}
Amounts are in dollars as plain numbers (no $ signs). Never return an empty items array if the user described any spending — make a reasonable single-item guess instead.`;
    let userContent;
    if(photoPreview){
      const content=[{type:'image',source:{type:'base64',media_type:photoPreview.mediaType,data:photoPreview.base64}}];
      content.push({type:'text',text:msg||'This is a photo of a receipt. Extract every line item, its price, and category.'});
      userContent=content;
    } else userContent=msg;
    try{
      const raw=await callClaude([{role:'user',content:userContent}],sys);
      const s=raw.indexOf('{'),en=raw.lastIndexOf('}');
      if(s===-1)throw new Error('No JSON: '+raw.slice(0,120));
      const parsed=JSON.parse(raw.slice(s,en+1));
      const items=(parsed.items||[]).map(it=>({name:it.name||'Purchase',description:it.description||'',amount:it.amount||0,category:CAT_MAP[it.category]?it.category:'other'}));
      setReviewItems(items);
      setReviewTitle(photoPreview?'Review scanned receipt':'Review parsed purchases');
      setAiText(''); setPhotoPreview(null);
    } catch(err){
      alert('Could not parse: '+err.message);
    }
    setLoading(false);
  }

  function handlePhotoSelect(e){
    const file=e.target.files[0]; if(!file)return;
    const reader=new FileReader();
    reader.onload=()=>{
      const dataUrl=reader.result;
      const base64=dataUrl.split(',')[1];
      setPhotoPreview({dataUrl,base64,mediaType:file.type||'image/jpeg'});
    };
    reader.readAsDataURL(file);
    e.target.value='';
  }

  async function handleManualAdd(){
    if(!manual.name.trim()&&!manual.amount)return;
    await saveRows([{name:manual.name.trim()||'Purchase',description:manual.description.trim(),amount:manual.amount,category:manual.category}]);
    setManual({name:'',amount:'',category:'groceries',description:''});
  }

  async function deletePurchase(id){
    await sb.from('purchases').delete().eq('id',id).eq('user_id',user.id);
    setPurchases(p=>p.filter(x=>x.id!==id));
  }

  async function clearAll(){
    await sb.from('purchases').delete().eq('user_id',user.id);
    await sb.from('budgets').delete().eq('user_id',user.id);
    setPurchases([]); setBudgets({}); setShowConfirm(false);
  }

  async function saveBudget(){
    const amt=parseFloat(budgetInput)||0;
    const existing=budgets[selectedMonth];
    if(existing&&existing.id){
      await sb.from('budgets').update({amount:amt,label:labelInput}).eq('id',existing.id);
      setBudgets(p=>({...p,[selectedMonth]:{...p[selectedMonth],amount:amt,label:labelInput}}));
    } else {
      const {data,error}=await sb.from('budgets').insert({user_id:user.id,month:selectedMonth,amount:amt,label:labelInput}).select().single();
      if(error){alert('DB error: '+error.message);return;}
      setBudgets(p=>({...p,[selectedMonth]:{id:data.id,amount:amt,label:labelInput}}));
    }
  }

  // ── Derived data ────────────────────────────────────────────
  const purchasesByMonth=useMemo(()=>{
    const map={};
    purchases.forEach(p=>{ const mk=monthKey(p.date); (map[mk]=map[mk]||[]).push(p); });
    return map;
  },[purchases]);

  function totalsFor(mk){
    const list=purchasesByMonth[mk]||[];
    const totals={}; let sum=0;
    list.forEach(p=>{ totals[p.category]=(totals[p.category]||0)+p.amount; sum+=p.amount; });
    return {totals,sum,list};
  }
  function budgetOf(mk){ return budgets[mk]?.amount||0; }

  const allMonthKeys=useMemo(()=>{
    const s=new Set([...Object.keys(purchasesByMonth),...Object.keys(budgets)]);
    return [...s].sort();
  },[purchasesByMonth,budgets]);

  // lifetime surplus = sum over all months with a budget set, of (budget - spent)
  const lifetimeSurplus=useMemo(()=>{
    return allMonthKeys.reduce((s,mk)=>s+(budgetOf(mk)-totalsFor(mk).sum),0);
  },[allMonthKeys,purchasesByMonth,budgets]);
  const lifetimeSpent=useMemo(()=>purchases.reduce((s,p)=>s+p.amount,0),[purchases]);

  function trendBuckets(range){
    const n=range==='3m'?3:range==='6m'?6:12;
    const mks=lastNMonthKeys(n);
    return mks.map(mk=>({mk,label:monthShort(mk),spent:totalsFor(mk).sum,budget:budgetOf(mk),totals:totalsFor(mk).totals}));
  }

  // ── Sidebar ─────────────────────────────────────────────────
  function Sidebar(){
    return h('div',{className:'sidebar'},
      h('div',{className:'stop'},
        h('div',{className:'mode-tabs'},
          ['ai','scan','manual'].map(m=>h('div',{key:m,className:'mtab'+(inputMode===m?' on':''),onClick:()=>setInputMode(m)},m==='ai'?'✨ AI':m==='scan'?'📷 Scan':'✏️ Manual'))
        ),
        inputMode==='ai'&&h('div',null,
          h('textarea',{className:'cta',placeholder:'e.g. "HEB groceries $84.50" or "gas $42, Netflix $15.49, dog food $28"',value:aiText,onChange:e=>setAiText(e.target.value)}),
          h('div',{className:'crow'},
            h('button',{className:'sbtn',onClick:handleAiSend,disabled:loading||!aiText.trim()},loading?h(Bubble):'→')
          ),
          h('div',{className:'hint'},'Describe what you bought — the AI splits it into items and picks a category for each.')
        ),
        inputMode==='scan'&&h('div',null,
          h('input',{ref:fileInputRef,type:'file',accept:'image/*',capture:'environment',style:{display:'none'},onChange:handlePhotoSelect}),
          !photoPreview&&h('div',{className:'camrow'},h('button',{className:'cambtn',onClick:()=>fileInputRef.current?.click()},'📷 Take / upload receipt photo')),
          photoPreview&&h('div',{className:'photo-prev'},h('img',{src:photoPreview.dataUrl}),h('div',{className:'photo-x',onClick:()=>setPhotoPreview(null)},'✕')),
          photoPreview&&h('textarea',{className:'cta',style:{marginTop:'7px'},placeholder:'Optional note (store name, context)…',value:aiText,onChange:e=>setAiText(e.target.value)}),
          photoPreview&&h('button',{className:'add-btn',onClick:handleAiSend,disabled:loading},loading?h(Bubble):'Scan & extract items'),
          h('div',{className:'hint'},'Snap a photo of a receipt — the AI reads every line item, price, and category.')
        ),
        inputMode==='manual'&&h('div',null,
          h('input',{className:'sinput mb',placeholder:'Item or store name',value:manual.name,onChange:e=>setManual(p=>({...p,name:e.target.value}))}),
          h('div',{className:'man-grid'},
            h('input',{className:'sinput',type:'number',placeholder:'Amount ($)',value:manual.amount,onChange:e=>setManual(p=>({...p,amount:e.target.value}))}),
            h('select',{className:'sinput',value:manual.category,onChange:e=>setManual(p=>({...p,category:e.target.value}))},CATEGORIES.map(c=>h('option',{key:c.id,value:c.id},c.label)))
          ),
          h('input',{className:'sinput mb',placeholder:'Extra description (optional)',value:manual.description,onChange:e=>setManual(p=>({...p,description:e.target.value}))}),
          h('button',{className:'add-btn',onClick:handleManualAdd},'Add purchase')
        )
      ),
      h('div',{className:'log'},
        purchases.length===0&&h('div',{className:'empty'},h('div',{className:'eico'},'🛒'),'No purchases yet'),
        [...purchases].sort((a,b)=>new Date(a.at)-new Date(b.at)).slice(-60).map(p=>{
          const ci=catInfo(p.category);
          return h('div',{key:p.id,className:'li'},
            h('div',{className:'lh'},
              h('div',null,
                h('div',{className:'ln'},p.name),
                p.description&&h('div',{className:'ldesc'},p.description)
              ),
              h('div',{style:{display:'flex',alignItems:'center',gap:'6px'}},h('span',{className:'lamt'},fmtMoney(p.amount)),h('button',{className:'ldel',onClick:()=>deletePurchase(p.id)},'✕'))
            ),

  // ── Views ───────────────────────────────────────────────────
  function ViewMonth(){
    const {totals,sum}=totalsFor(selectedMonth);
    const budget=budgetOf(selectedMonth);
    const surplus=budget-sum;
    const idx=allMonthKeys.indexOf(selectedMonth);
    return h('div',null,
      h('div',{className:'stitle'},
        h('span',null,monthLabel(selectedMonth)),
        h('div',{style:{display:'flex',gap:'6px'}},
          h('button',{className:'hbtn',onClick:()=>setSelectedMonth(addMonths(selectedMonth,-1))},'← Prev'),
          h('button',{className:'hbtn',onClick:()=>setSelectedMonth(addMonths(selectedMonth,1))},'Next →')
        )
      ),

      h('div',{className:'g3'},
        h('div',{className:'card'},h('div',{className:'ctitle'},'Budget'),h('div',{className:'snum'},fmtMoney(budget))),
        h('div',{className:'card'},h('div',{className:'ctitle'},'Spent'),h('div',{className:'snum',style:{color:budget>0&&sum>budget?'var(--danger)':'var(--text)'}},fmtMoney(sum)),budget>0&&h(BudgetBar,{spent:sum,budget})),
        h('div',{className:'card'},h('div',{className:'ctitle'},'Surplus'),h('div',{className:'snum '+(surplus>=0?'surplus-pos':'surplus-neg')},fmtMoney(surplus)))
      ),
      h('div',{className:'card'},
        h('div',{className:'ctitle'},'Spending by category'),
        h(CategoryPie,{totals})
      ),
      h('div',{className:'card'},
        h('div',{className:'ctitle'},'Category totals'),
        Object.keys(totals).length===0&&h('div',{className:'empty'},'Nothing logged for this month'),
        Object.entries(totals).sort((a,b)=>b[1]-a[1]).map(([k,v])=>{
          const ci=catInfo(k);
          return h('div',{key:k,className:'catrow',onClick:()=>{setDrill({category:k,mode:'month',mk:selectedMonth});setView('category');}},
            h('div',{className:'catdot',style:{background:ci.color}}),

          );

  function ViewTrends(){
    const buckets=trendBuckets(trendRange);
    const totalSpent=buckets.reduce((s,b)=>s+b.spent,0);
    const totalBudget=buckets.reduce((s,b)=>s+b.budget,0);

    return h('div',null,
      h('div',{className:'stitle'},
        h('span',null,'Trends'),
        h('div',{className:'range-tabs'},['3m','6m','1y'].map(r=>h('div',{key:r,className:'rtab'+(trendRange===r?' on':''),onClick:()=>setTrendRange(r)},r.toUpperCase())))
      ),
      h('div',{className:'g3'},
        h('div',{className:'card'},h('div',{className:'ctitle'},'Total budget'),h('div',{className:'snum'},fmtMoney(totalBudget))),
        h('div',{className:'card'},h('div',{className:'ctitle'},'Total spent'),h('div',{className:'snum'},fmtMoney(totalSpent))),
        h('div',{className:'card'},h('div',{className:'ctitle'},'Total surplus'),h('div',{className:'snum '+((totalBudget-totalSpent)>=0?'surplus-pos':'surplus-neg')},fmtMoney(totalBudget-totalSpent)))
      ),
      h('div',{className:'card'},
        h('div',{className:'ctitle'},'Spend per month'),
        h(BarTrend,{buckets,onClick:b=>{setSelectedMonth(b.mk);setView('month');}})
      ),
      h('div',{className:'card'},
        h('div',{className:'ctitle'},'Category breakdown ('+trendRange.toUpperCase()+')'),
        h(CategoryPie,{totals:combined})
      ),
      h('div',{className:'card'},
        h('div',{className:'ctitle'},'Category totals'),
        Object.keys(combined).length===0&&h('div',{className:'empty'},'Nothing logged for this period'),
        Object.entries(combined).sort((a,b)=>b[1]-a[1]).map(([k,v])=>{
          const ci=catInfo(k);
          return h('div',{key:k,className:'catrow',onClick:()=>{setDrill({category:k,mode:'trend',range:trendRange});setView('category');}},

            h('span',{className:'catname'},ci.label),
            h('span',{className:'catpct'},totalSpent?Math.round((v/totalSpent)*100)+'%':''),
            h('span',{className:'catamt'},fmtMoney(v))
          );
        })
      )
    );
  }

  function ViewCategory(){
    if(!drill)return h('div',{className:'empty'},'Pick a category from Month or Trends to drill in.');
    const ci=catInfo(drill.category);
    let list=[], rangeLabel='';
    if(drill.mode==='month'){
      list=(purchasesByMonth[drill.mk]||[]).filter(p=>p.category===drill.category);
      rangeLabel=monthLabel(drill.mk);
    } else {
      const n=drill.range==='3m'?3:drill.range==='6m'?6:12;
      const mks=lastNMonthKeys(n);
      list=mks.flatMap(mk=>(purchasesByMonth[mk]||[]).filter(p=>p.category===drill.category));
      rangeLabel='Last '+drill.range.toUpperCase();
    }
    list=[...list].sort((a,b)=>new Date(b.at)-new Date(a.at));
    const total=list.reduce((s,p)=>s+p.amount,0);
    return h('div',null,
      h('div',{className:'backlink',onClick:()=>setView(drill.mode==='month'?'month':'trends')},'← Back'),
      h('div',{className:'stitle'},h('span',null,ci.label+' — '+rangeLabel)),
      h('div',{className:'card'},
        h('div',{className:'ctitle'},'Total'),
        h('div',{className:'snum'},fmtMoney(total)),
        h('div',{style:{fontSize:'12px',color:'var(--text3)',marginTop:'4px'}},list.length+' purchase'+(list.length===1?'':'s'))
      ),
      h('div',{className:'card'},
        h('div',{className:'ctitle'},'Purchases'),
        list.length===0&&h('div',{className:'empty'},'No purchases in this category & period'),
        list.map(p=>h('div',{key:p.id,className:'hentry'},
          h('div',{className:'hrow'},
            h('div',null,h('div',{className:'hname'},p.name),p.description&&h('div',{className:'hdesc'},p.description),h('div',{style:{fontSize:'10px',color:'var(--text3)',marginTop:'2px'}},p.date)),
            h('span',{className:'hamt'},fmtMoney(p.amount))
          )
        ))
      )
    );
  }

  function ViewHistory(){
    const mks=[...allMonthKeys].reverse();
    return h('div',null,
      h('div',{className:'stitle'},'Full history'),
      h('div',{className:'g3'},
        h('div',{className:'card'},h('div',{className:'ctitle'},'Lifetime spent'),h('div',{className:'snum'},fmtMoney(lifetimeSpent))),
        h('div',{className:'card'},h('div',{className:'ctitle'},'Lifetime surplus'),h('div',{className:'snum '+(lifetimeSurplus>=0?'surplus-pos':'surplus-neg')},fmtMoney(lifetimeSurplus))),
        h('div',{className:'card'},h('div',{className:'ctitle'},'Months tracked'),h('div',{className:'snum'},mks.length))
      ),
      mks.length===0&&h('div',{className:'empty'},h('div',{className:'eico'},'📜'),'Nothing logged yet'),
      mks.map(mk=>{
        const {totals,sum,list}=totalsFor(mk);
        const budget=budgetOf(mk);
        const sorted=[...list].sort((a,b)=>new Date(b.at)-new Date(a.at));
        return h('div',{key:mk},
          h('div',{className:'month-hdr'},
            h('div',null,
              h('div',{className:'month-title',style:{cursor:'pointer'},onClick:()=>{setSelectedMonth(mk);setView('month');}},monthLabel(mk)),
              budgets[mk]?.label&&h('div',{className:'month-label-tag'},'“'+budgets[mk].label+'”')
            )
          ),
          h('div',{className:'month-sub',style:{marginBottom:'6px'}},'Budget '+fmtMoney(budget)+' · Spent '+fmtMoney(sum)+' · Surplus '+fmtMoney(budget-sum)),
          sorted.map(p=>h('div',{key:p.id,className:'hentry'},
            h('div',{className:'hrow'},
              h('div',null,h('div',{className:'hname'},p.name),p.description&&h('div',{className:'hdesc'},p.description)),
              h('span',{className:'hamt'},fmtMoney(p.amount))
            )
          ))
        );
      })
    );
  }

  function ViewBudget(){
    return h('div',null,
      h('div',{className:'stitle'},'Budget — '+monthLabel(selectedMonth)),
      h('div',{className:'card'},
        h('div',{className:'grow'},h('label',null,'Monthly budget ($)'),h('input',{type:'number',value:budgetInput,onChange:e=>setBudgetInput(e.target.value)})),
        h('div',{className:'grow'},h('label',null,'Label / notes for this month'),h('input',{placeholder:'e.g. "Guests over for Christmas"',value:labelInput,onChange:e=>setLabelInput(e.target.value)})),
        h('button',{className:'savebtn',onClick:saveBudget},'Save budget')
      ),
      h('div',{className:'card'},
        h('div',{className:'ctitle'},'Switch month'),
        h('div',{style:{display:'flex',gap:'6px'}},
          h('button',{className:'hbtn',onClick:()=>setSelectedMonth(addMonths(selectedMonth,-1))},'← '+monthLabel(addMonths(selectedMonth,-1))),
          h('button',{className:'hbtn',onClick:()=>setSelectedMonth(todayMonthKey())},'This month'),
          h('button',{className:'hbtn',onClick:()=>setSelectedMonth(addMonths(selectedMonth,1))},monthLabel(addMonths(selectedMonth,1))+' →')
        )
      ),
      h('div',{className:'card'},
        h('div',{className:'ctitle'},'Past budgets'),
        [...allMonthKeys].reverse().slice(0,12).map(mk=>h('div',{key:mk,className:'catrow',onClick:()=>setSelectedMonth(mk)},
          h('span',{className:'catname'},monthLabel(mk)+(budgets[mk]?.label?' — “'+budgets[mk].label+'”':'')),
          h('span',{className:'catamt'},fmtMoney(budgetOf(mk)))
        ))
      )
    );
  }

  function ViewSettings(){
    return h('div',null,
      h('h1',{className:'stitle'},'Settings'),
      h('div',{className:'card'},
        h('div',{className:'ctitle'},'Account'),
        h('button',{className:'savebtn',style:{background:'rgba(192,80,74,.12)',color:'var(--danger)',marginRight:'9px'},onClick:()=>setShowConfirm(true)},'Clear all data'),
        h('button',{className:'savebtn',style:{background:'var(--surface2)',color:'var(--text2)',border:'1px solid var(--border)'},onClick:onLogout},'Sign out')
      ),
      h('div',{className:'card'},
        h('div',{className:'ctitle'},'Categories in use'),
        h('div',{style:{display:'flex',flexWrap:'wrap',gap:'6px'}},CATEGORIES.map(c=>h('span',{key:c.id,className:'catpill',style:{background:c.color+'22',color:c.color}},c.label)))
      )
    );
  }

  const VIEWS={month:ViewMonth,trends:ViewTrends,category:ViewCategory,history:ViewHistory,budget:ViewBudget,settings:ViewSettings};
  const CurrentView=VIEWS[view]||ViewMonth;

  return h('div',{className:'app'},
    reviewItems&&h(ReviewOverlay,{items:reviewItems,title:reviewTitle,onClose:()=>setReviewItems(null),onConfirm:async(rows)=>{await saveRows(rows);setReviewItems(null);}}),
    showConfirm&&h('div',{className:'ov',onClick:()=>setShowConfirm(false)},
      h('div',{className:'ovbox',style:{maxWidth:'340px',margin:'auto',borderRadius:'var(--radius)'},onClick:e=>e.stopPropagation()},
        h('div',{className:'ovtitle',style:{marginBottom:'8px'}},'Clear all data?'),
        h('div',{style:{fontSize:'13px',color:'var(--text2)',marginBottom:'18px',lineHeight:1.5}},'Permanently deletes all purchases and budgets.'),
        h('div',{style:{display:'flex',gap:'9px',justifyContent:'center'}},h('button',{className:'cbtn-no',onClick:()=>setShowConfirm(false)},'Cancel'),h('button',{className:'cbtn-yes',onClick:clearAll},'Clear all'))
      )
    ),
    h('header',{className:'header'},
      h('div',{className:'logo'},'SPROUT'),
      h('nav',{className:'desk-nav'},['month','trends','history','budget','settings'].map(v=>h('button',{key:v,className:'nb'+(view===v?' on':''),onClick:()=>setView(v)},v.charAt(0).toUpperCase()+v.slice(1)))),
      h('div',{style:{display:'flex',alignItems:'center',gap:'6px'}},
        syncing&&h('div',{className:'syncing'},h('div',{className:'spin-sm'}),'Syncing'),
        h('div',{style:{fontSize:'11px',color:'var(--text3)',padding:'3px 7px'}},user.email?.split('@')[0])
      )
    ),
    h('div',{className:'main'},Sidebar(),h('div',{className:'content'},CurrentView())),
    h('nav',{className:'mob-nav'},
      [{id:'month',ico:'📅',lbl:'Month'},{id:'trends',ico:'📊',lbl:'Trends'},{id:'history',ico:'📜',lbl:'History'},{id:'budget',ico:'💰',lbl:'Budget'},{id:'settings',ico:'⚙️',lbl:'More'}].map(t=>
        h('button',{key:t.id,className:'mnbtn'+(view===t.id?' on':''),onClick:()=>setView(t.id)},h('span',{className:'mnico'},t.ico),t.lbl)
      )
    )
  );
}

// ── Root ──────────────────────────────────────────────────────
function Root(){
  const [user,setUser]=useState(null);
  const [checking,setChecking]=useState(true);
  useEffect(()=>{
    sb.auth.getSession().then(({data})=>{setUser(data.session?.user||null);setChecking(false);});
    const {data:l}=sb.auth.onAuthStateChange((_,session)=>setUser(session?.user||null));
    return()=>l.subscription.unsubscribe();
  },[]);
  if(checking)return h('div',{style:{height:'100vh',display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:'14px',background:'#f7f3e7'}},
    h('div',{style:{fontFamily:'DM Serif Display,serif',fontSize:'26px',color:'#397856'}},'SPROUT'),
    h('div',{style:{width:'16px',height:'16px',border:'2px solid #ddd3b8',borderTopColor:'#4f9d78',borderRadius:'50%',animation:'spin .7s linear infinite'}})
  );
  if(!user)return h(AuthScreen,{onAuth:setUser});
  return h(App,{user,onLogout:async()=>{await sb.auth.signOut();setUser(null);}});
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Root));
</script>
</body>
</html>
